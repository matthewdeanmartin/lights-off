name: Build and Test (Windows)

on: [ push ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --all-extras --python-preference only-system

      - name: Lint
        run: uv run ruff check lights_off/

      - name: Test
        run: uv run pytest tests/test_utils.py tests/test_mastodon_account.py -v
