name: Build and Test (macOS)

on: [ push ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --all-extras --python-preference only-system

      - name: Lint
        run: uv run ruff check lights_off/

      - name: Test
        run: uv run pytest tests/test_utils.py tests/test_mastodon_account.py -v
