[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lights-off"
version = "0.1.0"
description = "An accessible Mastodon client for screen reader users, fork of Quinter"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Quin and Mason" },
    { name = "Matthew Martin", email = "matthewdeanmartin@gmail.com" }]
requires-python = ">=3.12"
keywords = ["mastodon", "accessibility", "screen-reader", "wxpython"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
]
dependencies = [
    "packaging>=24",
    "Mastodon.py>=2.2.1",
    "tweak>=1.0.4",
    "pyperclip>=1.8",
    "wxpython>=4.2",
    # Windows/macOS only — sound_lib uses BASS (Windows) or CoreAudio (macOS)
    "sound_lib>=0.8.8; sys_platform != 'linux'",
    # macOS screen reader integration
    "accessible_output2>=0.17; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "python-dotenv>=1",
    "ruff>=0.9",
]

[project.scripts]
lights-off = "lights_off.__main__:main"

[project.urls]
Homepage = "https://pypi.org/project/lights-off/"
Repository = "https://github.com/matthewdeanmartin/lights-off"
"Bug Tracker" = "https://github.com/matthewdeanmartin/lights-off/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["lights_off"]
# Hatchling includes all files under lights_off/ by default, including
# .ogg, .keymap, .dll resource files, and vendored keyboard_handler.
exclude = [
    "tests/",
    "spec/",
    "*.pyw",
    "*.bat",
]

[tool.hatch.build.targets.sdist]
include = [
    "lights_off/",
    "tests/",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["W191", "E101", "E1", "I001", "E501"]

[dependency-groups]
dev = [
    "jiggle-version>=2.1.0",
    "troml-dev-status>=0.6.0",
    "dont-be-lazy>=0.1.2",
    "pydoc-fork>=3.0.0",
]

[tool.uv]
default-groups = ["dev"]
